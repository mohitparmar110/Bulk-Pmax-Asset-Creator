
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designoir Space - Your Creative OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600;1,700&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,500,700,400,900&f[]=satoshi@900,700,500,300,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --void: #06060a;
        --deep: #0c0c12;
        --surface: #111118;
        --raised: #181820;
        --lift: #1f1f28;
        --hover: #26262f;
        --gold: #c8a96e;
        --gold2: #dfc08a;
        --gold3: #f0d9ac;
        --ok: #4db896;
        --err: #d95f5f;
        --warn: #c98a3a;
        --ink: #ede8df;
        --font-serif: 'Cormorant', serif;
        --font-sans: 'Satoshi', sans-serif;
        --font-condensed: 'Barlow Condensed', sans-serif;
        --font-heading: 'Cabinet Grotesk', sans-serif;
      }
      body {
        background-color: var(--void);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .font-serif { font-family: var(--font-serif); }
      .font-sans { font-family: var(--font-sans); }
      .font-condensed { font-family: var(--font-condensed); }
      .font-heading { font-family: var(--font-heading); }
      .bg-void { background-color: var(--void); }
      .bg-deep { background-color: var(--deep); }
      .bg-surface { background-color: var(--surface); }
      .bg-raised { background-color: var(--raised); }
      .bg-lift { background-color: var(--lift); }
      .bg-hover { background-color: var(--hover); }
      .bg-gold { background-color: var(--gold); }
      .text-gold { color: var(--gold); }
      .text-ink { color: var(--ink); }
      .border-gold { border-color: var(--gold); }
      .border-surface { border-color: var(--surface); }
      .border-lift { border-color: var(--lift); }
      .canvas-container { margin: 0 auto; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
      
      /* Webkit Scrollbar styles */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--void); }
      ::-webkit-scrollbar-thumb { background: var(--surface); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--lift); }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "fabric": "https://esm.sh/fabric@^7.1.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-void text-ink">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
